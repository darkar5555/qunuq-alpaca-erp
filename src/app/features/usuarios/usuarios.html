<div class="page-head">
  <div>
    <h1 class="page-title">Usuarios</h1>
    <p class="page-subtitle">Gestiona las cuentas y roles del ERP.</p>
  </div>
  <p-button label="Nuevo usuario" icon="pi pi-plus" (onClick)="abrirNuevo()" />
</div>

<p-table
  [value]="usuarios()"
  [loading]="cargando()"
  [paginator]="usuarios().length > 10"
  [rows]="10"
  [rowHover]="true"
  styleClass="p-datatable-sm card-table"
>
  <ng-template #header>
    <tr>
      <th>Nombre</th>
      <th>Correo</th>
      <th>Rol</th>
      <th>Estado</th>
      <th style="width: 8rem"></th>
    </tr>
  </ng-template>

  <ng-template #body let-u>
    <tr [class.fila-inactiva]="!u.activo">
      <td>
        {{ u.nombre }}
        @if (u.id === miId) {
          <span class="yo">(tú)</span>
        }
      </td>
      <td>{{ u.email }}</td>
      <td>
        <p-tag
          [value]="rolLabel(u.rol)"
          [severity]="u.rol === 'ADMIN' ? 'warn' : u.rol === 'VENTAS' ? 'info' : 'secondary'"
        />
      </td>
      <td>
        <p-tag
          [value]="u.activo ? 'Activo' : 'Inactivo'"
          [severity]="u.activo ? 'success' : 'danger'"
        />
      </td>
      <td>
        <div class="acciones">
          <p-button
            icon="pi pi-pencil"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            (onClick)="abrirEditar(u)"
          />
          @if (u.activo) {
            @if (u.id !== miId) {
              <p-button
                icon="pi pi-ban"
                severity="danger"
                [text]="true"
                [rounded]="true"
                pTooltip="Desactivar"
                (onClick)="confirmarDesactivar(u)"
              />
            }
          } @else {
            <p-button
              icon="pi pi-refresh"
              severity="success"
              [text]="true"
              [rounded]="true"
              pTooltip="Reactivar"
              (onClick)="reactivar(u)"
            />
          }
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="5" class="vacio-tabla">Aún no hay usuarios registrados.</td>
    </tr>
  </ng-template>
</p-table>

<!-- Formulario crear/editar -->
<p-dialog
  [header]="tituloDialog()"
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [modal]="true"
  [style]="{ width: '30rem' }"
  [draggable]="false"
>
  <form [formGroup]="form" (ngSubmit)="guardar()" class="form-grid">
    <div class="campo campo-full">
      <label>Nombre</label>
      <input pInputText formControlName="nombre" />
    </div>

    <div class="campo campo-full">
      <label>Correo</label>
      <input pInputText type="email" formControlName="email" />
    </div>

    <div class="campo campo-full">
      <label>Rol</label>
      <p-select
        formControlName="rol"
        [options]="roles"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
      />
    </div>

    <div class="campo campo-full">
      <label>
        Contraseña
        <small>
          @if (editando()) {
            (deja en blanco para no cambiarla · mín. 6)
          } @else {
            (mín. 6 caracteres)
          }
        </small>
      </label>
      <input
        pInputText
        type="password"
        formControlName="password"
        autocomplete="new-password"
      />
    </div>
  </form>

  <ng-template #footer>
    <p-button
      label="Cancelar"
      severity="secondary"
      [text]="true"
      (onClick)="dialogVisible.set(false)"
    />
    <p-button
      label="Guardar"
      icon="pi pi-check"
      [loading]="guardando()"
      (onClick)="guardar()"
    />
  </ng-template>
</p-dialog>
