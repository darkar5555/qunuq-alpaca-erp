<div class="page-head">
  <div>
    <h1 class="page-title">Mi perfil</h1>
    <p class="page-subtitle">Tus datos de cuenta y contraseña.</p>
  </div>
</div>

<div class="perfil-grid">
  <!-- Datos de la cuenta -->
  <section class="tarjeta">
    <div class="perfil-head">
      <div class="avatar-grande">{{ inicial() }}</div>
      <div>
        <h2 class="perfil-nombre">{{ usuario()?.nombre }}</h2>
        <p-tag [value]="rolLabel()" severity="info" />
      </div>
    </div>
    <dl class="datos">
      <dt>Correo</dt>
      <dd>{{ usuario()?.email }}</dd>
    </dl>
  </section>

  <!-- Cambio de contraseña -->
  <section class="tarjeta">
    <h2 class="tarjeta-titulo">Cambiar contraseña</h2>
    <form [formGroup]="form" (ngSubmit)="guardar()" class="form-col">
      <div class="campo">
        <label>Contraseña actual</label>
        <input
          pInputText
          type="password"
          formControlName="passwordActual"
          autocomplete="current-password"
        />
      </div>
      <div class="campo">
        <label>Nueva contraseña <small>(mín. 6 caracteres)</small></label>
        <input
          pInputText
          type="password"
          formControlName="passwordNueva"
          autocomplete="new-password"
        />
      </div>
      <div class="campo">
        <label>Confirmar nueva contraseña</label>
        <input
          pInputText
          type="password"
          formControlName="confirmar"
          autocomplete="new-password"
        />
      </div>
      <div class="acciones-form">
        <p-button
          label="Actualizar contraseña"
          icon="pi pi-check"
          [loading]="guardando()"
          (onClick)="guardar()"
        />
      </div>
    </form>
  </section>
</div>
