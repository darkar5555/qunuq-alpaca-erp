<div class="shell">
  @if (sidebarAbierto()) {
    <div class="overlay" (click)="cerrarSidebar()"></div>
  }

  <aside class="sidebar" [class.abierto]="sidebarAbierto()">
    <div class="brand">
      <span class="brand-mark">QA</span>
      <span class="brand-name">Qunuq Alpaca</span>
    </div>

    <nav class="nav">
      @for (item of menuVisible(); track item.link) {
        <a
          [routerLink]="item.link"
          routerLinkActive="active"
          class="nav-item"
          (click)="cerrarSidebar()"
        >
          <i [class]="item.icon"></i>
          <span>{{ item.label }}</span>
          @if (item.link === '/solicitudes' && solicitudesNuevas() > 0) {
            <span class="badge">{{ solicitudesNuevas() }}</span>
          }
        </a>
      }
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <button
        class="menu-toggle"
        type="button"
        (click)="toggleSidebar()"
        aria-label="Abrir menú"
      >
        <i class="pi pi-bars"></i>
      </button>

      <div class="topbar-right">
        <a
          class="topbar-user"
          routerLink="/perfil"
          routerLinkActive="active"
          pTooltip="Mi perfil"
          tooltipPosition="bottom"
        >
          <div class="avatar">{{ (usuario()?.nombre ?? '?')[0] }}</div>
          <div class="user-meta">
            <strong>{{ usuario()?.nombre }}</strong>
            <small>{{ usuario()?.rol }}</small>
          </div>
        </a>
        <p-button
          label="Salir"
          icon="pi pi-sign-out"
          severity="secondary"
          [text]="true"
          (onClick)="logout()"
        />
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>

  <!-- Avisos y confirmaciones, disponibles para todas las páginas -->
  <p-toast position="top-right" />
  <p-confirmdialog />
</div>
